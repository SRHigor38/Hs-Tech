<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>{% block title %}{{ empresa.nome }} | Tecnologia para seu negócio{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ empresa.nome }} — Desenvolvimento de sites, sistemas, lojas virtuais e automações. Tecnologia premium para seu negócio.{% endblock %}">
    <meta name="keywords" content="{{ empresa.nome }}, desenvolvimento de sites, landing pages, sistemas web, lojas virtuais, automações">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ empresa.nome }}">
    <meta property="og:title" content="{% block og_title %}{{ empresa.nome }} | Tecnologia para seu negócio{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Desenvolvimento de sites, sistemas, lojas virtuais e automações.{% endblock %}">
    <meta property="og:image" content="{{ url_for('static', filename='img/og/og-default.svg') }}">
    <meta property="og:locale" content="pt_BR">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}{{ empresa.nome }} | Tecnologia para seu negócio{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Desenvolvimento de sites, sistemas, lojas virtuais e automações.{% endblock %}">

    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename=empresa.favicon or 'icons/favicon.svg') }}">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">{{ {"@context": "https://schema.org", "@type": "Organization", "name": empresa.nome, "description": empresa.descricao, "email": empresa.email, "telephone": "+" ~ empresa.whatsapp, "sameAs": [empresa.instagram, empresa.linkedin, empresa.github]|select|list}|tojson }}</script>

    {% block extra_css %}{% endblock %}
</head>
<body data-whatsapp="{{ empresa.whatsapp }}">

    <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a>
    {% include "partials/navbar.html" %}

    <main id="conteudo-principal" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}
    {% include "partials/whatsapp_float.html" %}

    <!-- JavaScript -->
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}

</body>
</html>
