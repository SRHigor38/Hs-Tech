<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Entrar no painel | HS Tech</title><link rel="icon" type="image/svg+xml" href="{{ url_for('static',filename='icons/favicon.svg') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/login-admin.css') }}"></head><body><main class="login-page"><section class="login-card"><a class="login-brand" href="{{ url_for('main.home') }}" aria-label="HS Tech — página inicial"><span>HS</span><strong>HS <b>TECH</b></strong></a><div class="login-eyebrow">ACESSO ADMINISTRATIVO</div><h1>Bem-vindo ao painel.</h1><p>Acesse as ferramentas de gestão da HS Tech.</p>{% with mensagens = get_flashed_messages(with_categories=true) %}{% for categoria,mensagem in mensagens %}<div class="login-alert" role="alert">{{ mensagem }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username">Usuário</label><input id="username" name="username" required autocomplete="username" autofocus><label for="password">Senha</label><input id="password" name="password" type="password" required autocomplete="current-password"><button type="submit">Entrar no painel <span aria-hidden="true">↗</span></button></form><a class="login-back" href="{{ url_for('main.home') }}">← Voltar ao site</a></section></main></body></html>
