{% set active_page = request.endpoint %}

<header class="navbar" id="navbar">
    <div class="container navbar__inner">

        <!-- Logo -->
        <a href="{{ url_for('main.home') }}" class="navbar__logo" aria-label="{{ empresa.nome }} — Página inicial">
            {% if empresa.logo %}<img class="navbar__logo-icon" src="{{ url_for('static', filename=empresa.logo) }}" alt="" width="36" height="36">{% else %}<svg class="navbar__logo-icon" width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="2" y="2" width="32" height="32" rx="8" fill="url(#logoGradiente)"/>
                <text x="18" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">HS</text>
                <defs>
                    <linearGradient id="logoGradiente" x1="0" y1="0" x2="36" y2="36">
                        <stop stop-color="#0A84FF"/>
                        <stop offset="1" stop-color="#38B6FF"/>
                    </linearGradient>
                </defs>
            </svg>{% endif %}
            <span class="navbar__logo-text">{{ empresa.nome }}</span>
        </a>

        <!-- Links -->
        <nav class="navbar__nav" id="navbarNav" aria-label="Navegação principal">
            <a href="{{ url_for('main.home') }}"
               class="navbar__link {% if active_page == 'main.home' %}navbar__link--active{% endif %}">
                Home
            </a>
            <a href="{{ url_for('projetos.projetos') }}"
               class="navbar__link {% if active_page == 'projetos.projetos' %}navbar__link--active{% endif %}">
                Projetos
            </a>
            <a href="{{ url_for('main.sobre') }}"
               class="navbar__link {% if active_page == 'main.sobre' %}navbar__link--active{% endif %}">
                Sobre
            </a>
            <a href="{{ whatsapp_url }}" target="_blank" rel="noopener noreferrer" class="navbar__link">
                Contato
            </a>

            <a href="{{ url_for('main.contato') }}" class="btn btn--primary navbar__cta">
                Orçamento
            </a>
        </nav>

        <!-- Botão hamburger (mobile) -->
        <button class="navbar__hamburger" id="navbarToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="navbarNav">
            <span class="navbar__hamburger-bar"></span>
            <span class="navbar__hamburger-bar"></span>
            <span class="navbar__hamburger-bar"></span>
        </button>

    </div>
</header>
