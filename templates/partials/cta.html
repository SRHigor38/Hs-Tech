<!-- CTA reutilizável -->
{% set cta_titulo = cta_titulo or 'Pronto para começar seu projeto?' %}
{% set cta_descricao = cta_descricao or 'Fale com a HS Tech e descubra como podemos transformar sua ideia em realidade com tecnologia de ponta.' %}

<section class="cta reveal">
    <div class="container cta__inner">
        <div class="cta__content">
            <h2 class="cta__title">{{ cta_titulo }}</h2>
            <p class="cta__description">{{ cta_descricao }}</p>
        </div>
        <div class="cta__actions">
            <a href="{{ whatsapp_url }}" target="_blank" rel="noopener" class="btn btn--neon">
                Solicitar Orçamento
            </a>
            <a href="{{ url_for('main.contato') }}" class="btn btn--outline">
                Falar com a equipe
            </a>
        </div>
    </div>
    <div class="cta__glow" aria-hidden="true"></div>
</section>
